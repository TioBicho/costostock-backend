server:
  port: 8082

spring:
  application:
    name: ms-productos
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/productosdb}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

auth:
  token-key: ${AUTH_TOKEN_KEY}
