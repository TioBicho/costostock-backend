server:
  port: 8081

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/authdb}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

auth:
  token-key: ${AUTH_TOKEN_KEY}
  access-ttl-minutes: ${ACCESS_TTL_MINUTES:15}
  refresh-ttl-days: ${REFRESH_TTL_DAYS:7}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
